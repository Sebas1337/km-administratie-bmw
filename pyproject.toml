[project]
name = "kmlog"
version = "0.3.1"
description = "Automatische kilometeradministratie: BMW CarData -> ritten -> maandstaat"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[project.scripts]
kmlog = "kmlog.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb,s3,secretsmanager,ses]>=5",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmlog"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
