{# one open question card; needs q, csrf, here, describe #}
<div class="card q">
  <div><a href="/dag/{{ q.date.isoformat() }}">{{ q.date|day }}</a> — {{ describe(q.legs) }}</div>
  <div>{{ QUESTION_TEXT[q.question] }}</div>
  <div class="muted">{{ q.distance_km|km }} km gereden; nu {{ q.business_km|km }} km zakelijk, bij "zakelijk" {{ q.business_if_confirmed|km }} km.</div>
  <div class="buttons">
    {% for a in q.options %}
    <form class="inline" method="post" action="/antwoord">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="segment" value="{{ q.segment_id }}">
      <input type="hidden" name="answer" value="{{ a.value }}">
      <input type="hidden" name="next" value="{{ here }}">
      <button {% if not loop.first %}class="secondary"{% endif %}>{{ ANSWER_LABELS[a] }}</button>
    </form>
    {% endfor %}
  </div>
</div>
