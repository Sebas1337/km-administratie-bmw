# Voorbeeld-stamdata: auto en locaties (nep-coördinaten) zijn verzonnen. Kopieer naar
# data/stamdata.toml (gitignored) en vul je eigen gegevens in. Inlezen: uv run kmlog stamdata data/stamdata.toml
# (of met --store dynamodb in AWS). Daarna kun je locaties ook in de webinterface beheren.
# Afstanden tussen locaties vul je niet in: die leert km-admin uit de ritten (ONTWERP §7.2).

# De auto waarvoor je km-vergoeding declareert; komt in de kop van de maandstaat.
[vehicle]
name = "BMW"
plate = "AB-123-C"

# Locaties: type = home | client | business | private; radius_m (default 200) bepaalt hoe dicht
# de auto erbij moet staan om "op die locatie" te zijn. Coördinaten: rechtsklik in Google Maps.
[[location]]
id = "home"
name = "Thuis"
type = "home"
lat = 52.0000
lon = 4.5000

[[location]]
id = "client"
name = "Klant"
type = "client"
lat = 52.3000
lon = 4.9000

# Vergoeding per km, per kalenderjaar, in centen.
[[rate]]
year = 2026
cents_per_km = 25
